name: Publish crate

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  crates-io:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
