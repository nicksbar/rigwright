name: GitHub Release

"on":
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Create GitHub Release
        run: >-
          gh release create "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --generate-notes
          --title "Rigwright $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
